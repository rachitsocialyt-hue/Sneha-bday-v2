<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#140d17">
  <meta name="description" content="A little birthday scrapbook made especially for Sneha.">
  <title>Happy Birthday, Sneha ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="ambient" class="ambient" aria-hidden="true"></div>
  <button id="musicToggle" class="music-toggle" type="button" aria-label="Play background music" title="Play / pause music">🔇</button>
  <audio id="bgMusic" preload="auto" loop src="assets/audio/birthday-piano.mp3"></audio>

  <main class="stage">
    <div class="book-shell">
      <div class="book-glow"></div>
      <div class="book" id="book" aria-live="polite">
        <div class="page-layer" id="pageLayer"></div>
        <div class="paper-grain"></div>
      </div>
      <div class="nav-row">
        <button id="prevBtn" class="nav-btn" type="button" aria-label="Previous page">←</button>
        <div id="pageCounter" class="page-counter">1 / 7</div>
        <button id="nextBtn" class="nav-btn" type="button" aria-label="Next page">→</button>
      </div>
      <div class="swipe-hint">Swipe or use the arrows to turn the page</div>
    </div>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/app.js"></script>
</body>
</html>
